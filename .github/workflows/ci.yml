name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: offerbound
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: offerbound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offerbound -d offerbound"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://offerbound:local-dev-only@localhost:5432/offerbound
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the api image
        run: docker build -f apps/api/Dockerfile -t offerbound-api .
      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t offerbound-web .
      - name: The api image carries the Prisma CLI (migrations run on start)
        run: docker run --rm offerbound-api pnpm exec prisma --version
      - name: Smoke-test the api image (non-root, writable /backups, offline start tools)
        run: |
          uid="$(docker run --rm offerbound-api id -u)"
          test "$uid" != "0"
          docker run --rm offerbound-api sh -c 'touch /backups/.write-test && rm /backups/.write-test'
          # The worker uses the same image and user; the container must not need the npm registry.
          docker run --rm --network none offerbound-api pnpm --version
          docker run --rm --network none offerbound-api pnpm exec prisma --version
      - name: Validate the Caddyfile
        run: docker run --rm -v "$PWD/apps/web/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate compose.prod.yaml
        env:
          PUBLIC_BASE_URL: https://offerbound.example
          SERVICE_PASSWORD_POSTGRES: ci-placeholder
          OWNER_EMAIL: owner@example.com
          GOOGLE_CLIENT_ID: client-id.example
          GOOGLE_CLIENT_SECRET: ci-placeholder
          TOKEN_ENCRYPTION_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          AI_PRICING: "{}"
          AI_WEB_SEARCH_COST_PER_CALL_MICROS: "10000"
        run: docker compose -f compose.prod.yaml config --quiet
