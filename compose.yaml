# Local development database. Production uses compose.prod.yaml.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: offerbound
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: offerbound
    ports:
      - "5432:5432"
    volumes:
      - offerbound-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerbound -d offerbound"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  offerbound-db:
